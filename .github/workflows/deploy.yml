name: Deploy Bank Bill Dashboard

on:
  schedule:
    # 云端为主架构：每天 6 次运行（2026-10-24 增加 2 次，目标北京 17:00 / 22:00 推送档）。
    # GitHub Actions cron 延迟不稳定（实测 3-5.5 小时），无法精确命中时刻；
    # 具体推送时刻由 push_schedule.PUSH_SLOTS 按北京时间档位判定 + 同日去重，
    # 不依赖 cron 精确命中，cron 只需保证每个档位窗口内有运行落入即可。
    - cron: '0 20 * * *'  # UTC 20:00 = 北京 04:00（实际约 06:00-09:00，morning 档：未来4天）
    - cron: '0 2 * * *'   # UTC 02:00 = 北京 10:00（实际约 14:00-16:00，afternoon 档：今日+逾期）
    - cron: '0 4 * * *'   # UTC 04:00 = 北京 12:00（实际约 15:00-17:30，t1700 档：今日+逾期）★新增
    - cron: '0 8 * * *'   # UTC 08:00 = 北京 16:00（实际约 20:00-22:00，evening 档：今日+逾期）
    - cron: '0 9 * * *'   # UTC 09:00 = 北京 17:00（实际约 21:00-23:00，t2200 档：今日+逾期）★新增
    - cron: '0 14 * * *'  # UTC 14:00 = 北京 22:00（实际约 02:00-05:00，凌晨档只同步不推送）
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：Commit run log 步骤需要 rebase + push 回 main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          # P0-7 云端优先：显式声明 cloud 角色（全流程：提取→滴答同步→飞书→仪表盘→状态回传）
          RUN_ROLE: cloud
          # 多邮箱配置：JSON 字符串，每个邮箱可配置 label（如 YY）
          # 格式: [{"address":"...","password":"...","imap_server":"...","imap_port":993,"label":"YY"}]
          # 如果未配置 EMAILS_JSON，会回退到 EMAIL_ADDRESS/EMAIL_PASSWORD 单邮箱模式
          EMAILS_JSON: ${{ secrets.EMAILS_JSON }}
          # 单邮箱模式（向后兼容，EMAILS_JSON 未配置时使用）
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          TICKTICK_API_KEY: ${{ secrets.TICKTICK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # WXpusher 微信推送（2026-10-27）：云端无 config.json（已被 .gitignore），
          # 凭据只能走 GitHub Secrets。三个 secret 未配置时值为空字符串，
          # generate_dashboard.push_to_wxpusher 判定为未启用并跳过，不会报错。
          # 需在仓库 Settings → Secrets and variables → Actions 添加：
          #   WXPUSHER_APP_TOKEN = AT_ 开头的 AppToken
          #   WXPUSHER_UIDS      = UID_xxx,UID_yyy（多个用英文逗号分隔，安卓+苹果）
          #   WXPUSHER_ENABLED   = 1
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_ENABLED: ${{ secrets.WXPUSHER_ENABLED }}
        run: |
          python generate_dashboard.py

      # 云端为主架构：把本次云端运行的运行日志 + 状态文件推回 main 分支，
      # 形成状态闭环（下次 checkout 拿到最新完成检测基准）。
      # commit message 带 [skip ci]，避免 push 事件再次触发本 workflow
      - name: Commit run log & state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_log.jsonl ticktick_sync_state.json ticktick_completed_titles.json ticktick_completed_amounts.json || true
          if git diff --cached --quiet; then
            echo "run log unchanged, skip commit"
            exit 0
          fi
          git commit -m "chore: append run log [skip ci]"
          # generate_dashboard 生成的 gh-pages/ 是未暂存变更，rebase 前自动 stash
          git config rebase.autoStash true
          git pull --rebase origin main || { echo "pull --rebase failed, keep local run log only"; exit 0; }
          git push || { echo "push failed (conflict with local auto-sync), local side will sync it"; exit 0; }

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './gh-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
