name: 账单自动提取（已停用调度）

# 2026-10-23 评估结论（P0-7/J）：本 workflow 与 deploy.yml 功能重叠——
#   - 旧引擎 ci_extract.py 只抓阿里云单邮箱，写 docs/bills.json；
#   - deploy.yml 的新引擎（generate_dashboard.py）已全量覆盖双邮箱 +
#     滴答同步 + 飞书 + 仪表盘，每天 4 次运行。
# docs/bills.json 无实际消费方（前端用 gh-pages/data.json；
# feishu_notify.py --push 仅作为历史回退候选，不在活路径）。
# 决策：禁用定时调度，仅保留手动触发（workflow_dispatch）供应急使用。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 提取银行账单
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          IMAP_SERVER: imap.aliyun.com
          IMAP_PORT: '993'
        run: |
          python ci_extract.py

      - name: 提交数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bills.json docs/bills_raw.json
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M') 账单数据" || echo "No changes to commit"
          git push

      - name: 输出摘要
        run: |
          echo "=== 账单提取完成 ==="
          cat docs/bills.json | python -m json.tool | head -20
